dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.138.1",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langsmith>=0.9.2",
    "loguru>=0.7.3",
    "mcp>=1.28.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "uvicorn>=0.49.0",
]

[dependency-groups]
